name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Check formatting and lint
        run: |
          uv run --frozen --extra dev ruff check metallum tests
          uv run --frozen --extra dev ruff format --check metallum tests

      - name: Type check
        run: uv run --frozen --extra dev mypy metallum

      - name: Test
        run: uv run --frozen --extra dev pytest tests

      - name: Build wheel
        run: uv build --wheel
