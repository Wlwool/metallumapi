[project]
name = "metallumapi"
version = "1.1.0"
description = "API for metal-archives.com"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Wlwool" }]
requires-python = ">=3.13,<4.0"
dependencies = [
    "requests>=2.31.0",
    "curl-cffi>=0.14.0",
    "pyquery>=2.0.0",
    "python-dateutil>=2.8.2",
    "lxml>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.0.0",
    "ruff>=0.17.3",
    "types-python-dateutil>=2.9.0.20261104",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "pyquery"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metallum"]
